services:
  postgres:
    image: postgres:17
    container_name: glintwein-postgres
    environment:
      POSTGRES_DB: glintwein
      POSTGRES_USER: glintwein
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
